name: Build Microsoft Store preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test
        run: python -m pytest -q
      - name: Build Windows bundle
        run: python packaging/build.py --bundle-only
      - name: Create unsigned preview MSIX
        run: python packaging/microsoft_store/build_msix.py --development
      - name: Render screenshots with synthetic sound
        run: python packaging/microsoft_store/capture_screenshots.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Store-preview-NOT-FOR-SUBMISSION
          if-no-files-found: error
          path: |
            dist/*-PREVIEW.msix
            dist/*-PREVIEW.json
            dist/*.source.tar.gz
            dist/store-assets/*.png
