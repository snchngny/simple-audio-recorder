name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYQTGRAPH_QT_LIB: PyQt6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Validate version tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF#refs/tags/v}" = "$(tr -d '\r\n' < VERSION)"
          fi
      - name: Test recording lifecycle and WAV export
        run: python -m pytest -q
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer
        run: python packaging/build.py
      - name: Smoke test Windows bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath dist/SimpleAudioRecorder/SimpleAudioRecorder.exe -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden
          if (!$app.WaitForExit(60000)) { $app.Kill(); throw '起動確認がタイムアウト' }
          if ($app.ExitCode -ne 0) { throw "起動確認に失敗: $($app.ExitCode)" }
      - name: Smoke test macOS bundle
        if: runner.os == 'macOS'
        run: dist/SimpleAudioRecorder.app/Contents/MacOS/SimpleAudioRecorder --smoke-test
      - name: Collect source and build environment
        shell: bash
        run: |
          git archive --format=tar.gz --prefix=SimpleAudioRecorder/ -o dist/SimpleAudioRecorder-source.tar.gz HEAD
          cp build/environment.txt dist/environment-${{ matrix.target }}.txt
          cp build/THIRD_PARTY_LICENSES.txt dist/licenses-${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleAudioRecorder-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*.dmg
            dist/*-source.tar.gz
            dist/environment-*.txt
            dist/licenses-*.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd installers
          sha256sum *.exe *.dmg *.tar.gz > SHA256SUMS.txt
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Windows x64 / macOS Apple Silicon・Intel。署名証明書・Apple公証は未設定。ソース、依存版一覧、ライセンスを添付。'
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
